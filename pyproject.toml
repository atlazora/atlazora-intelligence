[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "atlazora-intelligence"
version = "0.1.0"
description = "Atlazora Python intelligence foundation."
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.mypy]
python_version = "3.14"
